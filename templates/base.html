<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 オノマトペ学習支援システム</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');

    :root {
      --bg: #f5f8ff;
      --card: #ffffff;
      --border: #dbe4f0;
      --text: #2b3a55;
      --muted: #64748b;
      --blue: #2f6fed;
      --blue-soft: #e8f0fe;
      --green: #1d9e57;
      --green-soft: #e3f7ec;
      --orange: #e8890c;
      --orange-soft: #fff3df;
      --red: #d94848;
      --red-soft: #fdeaea;
      --purple: #7c5cd6;
      --purple-soft: #f0ebfc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    nav {
      background: var(--card);
      border-bottom: 2px solid var(--border);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    nav .logo { font-size: 1.1rem; font-weight: 700; color: var(--blue); }
    nav a { color: var(--muted); text-decoration: none; font-size: 0.88rem; font-weight: 700; }
    nav a:hover { color: var(--blue); }

    .container { max-width: 760px; margin: 36px auto; padding: 0 24px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(47, 111, 237, 0.06);
    }

    h1 { font-size: 1.5rem; color: var(--text); margin-bottom: 8px; }
    h2 { font-size: 1.15rem; color: var(--text); margin-bottom: 14px; }
    h3 { font-size: 0.95rem; color: var(--text); margin-bottom: 8px; }
    .muted { color: var(--muted); }
    .small { font-size: 0.82rem; }

    .btn {
      display: inline-block; padding: 10px 24px; border-radius: 10px; border: none;
      cursor: pointer; font-size: 0.9rem; font-family: inherit; font-weight: 700;
      text-decoration: none; transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-secondary { background: #eef2f8; color: var(--text); border: 1px solid var(--border); }

    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 700;
    }
    .badge-green  { background: var(--green-soft);  color: var(--green); }
    .badge-red    { background: var(--red-soft);    color: var(--red); }
    .badge-blue   { background: var(--blue-soft);   color: var(--blue); }
    .badge-orange { background: var(--orange-soft); color: var(--orange); }
    .badge-purple { background: var(--purple-soft); color: var(--purple); }
    .badge-gray   { background: #eef2f8;            color: var(--muted); }

    /* 素性のバッジ（継続性＝青／動作性＝橙／意志性＝紫） */
    .fbadge {
      display: inline-block; padding: 2px 9px; border-radius: 6px;
      font-size: 0.72rem; font-weight: 700; margin-right: 4px;
    }
    .fb-continuity { background: var(--blue-soft);   color: var(--blue); }
    .fb-action     { background: var(--orange-soft); color: var(--orange); }
    .fb-volition   { background: var(--purple-soft); color: var(--purple); }

    /* 選択肢カード（input は display:none で使う） */
    .opt-card {
      border: 2px solid var(--border); border-radius: 10px;
      padding: 12px 16px; background: #fff; transition: all 0.15s; cursor: pointer;
    }
    label:hover .opt-card { border-color: #b7c8e8; }
    input[type="radio"]:checked + .opt-card { border-color: var(--blue); background: var(--blue-soft); }

    /* 丸ピル型の素性選択 */
    .pill {
      display: inline-block; min-width: 48px; padding: 9px 14px; text-align: center;
      border-radius: 999px; background: #eef2f8; color: var(--muted);
      font-weight: 700; font-size: 0.85rem; border: 2px solid var(--border);
      transition: all 0.12s; cursor: pointer;
    }
    input[type="radio"]:checked + .pill { background: var(--blue); color: #fff; border-color: var(--blue); }

    .infobox {
      background: var(--blue-soft); border: 1px solid #c4d5f7;
      border-radius: 10px; padding: 12px 16px; font-size: 0.84rem;
    }
    .notebox {
      background: var(--orange-soft); border: 1px solid #f3d9ab;
      border-radius: 10px; padding: 12px 16px; font-size: 0.84rem;
    }
    .hintbox {
      background: var(--orange-soft); border: 1px solid #f3d9ab;
      border-radius: 10px; padding: 12px 16px; font-size: 0.82rem; margin-bottom: 12px;
    }
    .hint-toggle, .hint-btn {
      background: var(--orange-soft); border: 1px solid #f3d9ab; border-radius: 8px;
      color: var(--orange); font-size: 0.74rem; padding: 5px 10px; cursor: pointer;
      font-weight: 700; font-family: inherit; flex-shrink: 0;
    }
    .hint-toggle:hover, .hint-btn:hover { border-color: var(--orange); }
    .hint-btn:disabled { opacity: 0.45; cursor: default; }

    .result-item {
      border-left: 4px solid var(--green); padding: 8px 14px; margin-bottom: 12px;
      background: #fbfcfe; border-radius: 0 8px 8px 0;
    }
    .result-item.ng { border-left-color: var(--red); }

    /* 素性照合の箇条書き */
    ul.checklines { list-style: none; margin-top: 6px; }
    ul.checklines li {
      font-size: 0.8rem; color: var(--text); padding: 4px 0 4px 14px;
      position: relative; line-height: 1.55;
    }
    ul.checklines li::before {
      content: "—"; position: absolute; left: 0; color: var(--muted);
    }

    table.dtable { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    table.dtable th, table.dtable td {
      border: 1px solid var(--border); padding: 7px 9px; text-align: left; vertical-align: top;
    }
    table.dtable th { background: var(--blue-soft); color: var(--blue); font-size: 0.76rem; }
    .tscroll { overflow-x: auto; }
  </style>
</head>
<body>
<nav>
  <span class="logo">📚 オノマトペ学習支援</span>
  <a href="/">ホーム（語を選ぶ）</a>
  <a href="/reference">素性のまとめ</a>
  <a href="/drill/features">素性ドリル</a>
  <a href="/drill/expressions">前接条件ドリル</a>
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
