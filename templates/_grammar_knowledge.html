<section id="grammar" style="scroll-margin-top:20px;">
<div class="card">
  <h2>例：「いらいら」と文法形式</h2>
  <p class="small" style="margin:10px 0 16px;">前接条件＝文法形式の前に来る語が満たす条件。</p>
  <div class="tscroll"><table class="dtable" style="min-width:510px;">
    <thead><tr><th>文法形式</th><th>前接条件</th><th>「いらいら」との照合</th></tr></thead>
    <tbody>
      <tr><th scope="row">〜しはじめる</th><td>＋継続性・動作性（中・高）</td><td class="feedback-check is-correct">○ 条件を満たす</td></tr>
      <tr><th scope="row">〜するところだ</th><td>動作性（高）・＋意志性</td><td class="feedback-check is-incorrect">× 動作性・意志性が合わない</td></tr>
    </tbody>
  </table></div>
</div>

<details class="card knowledge-index">
  <summary>文法形式の前接条件（全{{ expr_cards|length }}形式）</summary>
  <div class="tscroll"><table class="dtable" style="min-width:590px;">
    <thead><tr><th>文法形式・局面</th><th>前接条件</th><th>例</th></tr></thead>
    <tbody>{% for c in expr_cards %}<tr>
      <th scope="row">〜{{ c.expr.label }}<div class="small muted" style="margin-top:4px;">{{ c.expr.phase }}</div></th>
      <td>{{ c.expr.cond_text }}</td><td>{{ c.expr.ok_example }}</td>
    </tr>{% endfor %}</tbody>
  </table></div>
</details>
</section>
