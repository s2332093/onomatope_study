<section id="grammar" style="scroll-margin-top:20px;">
<details class="card knowledge-index knowledge-important knowledge-grammar">
  <summary>文法形式の前接条件（全{{ expr_cards|length }}形式） <span class="knowledge-tag">重要</span></summary>
  <p class="lesson-instruction">「制限なし」は，その素性の値を問わないことを表します．「中・高」は，中または高の語が当てはまるという意味です．</p>
  <div class="tscroll"><table class="dtable" style="min-width:620px;">
    <thead><tr><th scope="col">文法形式・局面</th><th scope="col">継続性</th><th scope="col">動作性</th><th scope="col">意志性</th></tr></thead>
    <tbody>{% for c in expr_cards %}<tr>
      <th scope="row">〜{{ c.expr.label }}<div class="small muted" style="margin-top:4px;">{{ c.expr.phase }}</div></th>
      <td>{{ c.conditions.continuity }}</td><td>{{ c.conditions.action }}</td><td>{{ c.conditions.volition }}</td>
    </tr>{% endfor %}</tbody>
  </table></div>
</details>
</section>
