{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>🎉「{{ word.word }}」の学習が完了しました</h1>
  <p style="margin-top:12px;">意味の学習と文脈練習の2つのフェーズを終えました。</p>
</div>
<div class="card" style="text-align:center;">
  <p class="muted small" style="margin-bottom:14px;">実施者の案内に従い、ホーム画面で次に学ぶ語を選んでください。</p>
  <a href="{{ request.scope.get('study_prefix', '') }}/" class="btn btn-primary">ホーム画面に戻る</a>
</div>
<p class="muted small">全ての学習が終わったら、上部の「学習を終了・記録を保存」から記録を保存してください。</p>
{% endblock %}
