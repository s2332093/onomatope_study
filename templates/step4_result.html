{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1 style="color:var(--green);">全問正解！「{{ word.word }}」の学習が完了しました</h1>
  <p class="small muted">場面・文脈の問題（{{ n_correct }}／{{ total }} 正解）</p>
</div>
{% for r in results %}
<div class="card">
  <h2>問{{ r.no }}：あなたが選んだ形</h2>
  <div class="infobox" style="font-weight:700;">{{ r.completed }}</div>
  <p class="small" style="margin-top:12px;">「〜{{ r.label }}」の局面：{{ r.phase }}</p>
</div>
{% endfor %}
<div class="feedback-actions">
  <a href="{{ request.scope.get('study_prefix', '') }}/word/{{ word.id }}/complete" class="btn btn-primary">まとめを見る →</a>
  <a href="{{ request.scope.get('study_prefix', '') }}/word/{{ word.id }}/f3" class="btn btn-secondary">文脈問題をもう一度</a>
</div>
{% endblock %}
