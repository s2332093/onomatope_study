{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>📚 オノマトペ学習支援システム</h1>
  <p style="margin-top:12px;"><strong>フェーズ1：意味の学習 → フェーズ2：文脈練習</strong></p>
</div>
<h2>学習する語を選ぶ（全{{ total }}語）</h2>
{% for w in words %}
<a class="card" style="display:block; color:inherit; text-decoration:none;" href="{{ request.scope.get('study_prefix', '') }}/word/{{ w.id }}">
  <strong>{{ w.emoji }} {{ w.word }}</strong><p class="muted small">{{ w.scene }}</p>
</a>
{% endfor %}
{% endblock %}
