{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:600px;margin:24px auto;">
  <h1>学習を始める</h1>
  <p>名前を入力してください。</p>
  <p class="muted small">研究のため、入力した名前と、ページの使用時間・操作・解答・正誤・誤答回数を記録します。記録は研究者用の画面で確認します。</p>
  <p class="muted small">記録は学習中にこのブラウザへ一時保存し、全ての学習を終えた時にまとめて送信します。</p>
  {% if error %}<p role="alert" style="color:var(--red)">{{ error }}</p>{% endif %}
  <form method="post" action="{{ request.scope.get('study_prefix','') }}/registration">
  <input type="hidden" name="_study_participant" value="{{ request.state.participant }}">
  <input type="hidden" name="attempt_id" value="{{ request.state.form_attempt_id }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="learnerName" style="display:block;margin:20px 0 8px;font-weight:700">名前</label>
    <input id="learnerName" name="name" type="text" required maxlength="80" autocomplete="off" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font:inherit">
    <p class="muted small">実施者から指定された名前・参加者名を入力してください。同じ端末を次の人が使う場合は「利用者を変更」から入力し直してください。</p>
    <button class="btn btn-primary" type="submit">学習を始める</button>
  </form>
</div>
{% endblock %}
