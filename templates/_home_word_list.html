<div class="home-word-list">
  {% for row in word_rows %}
  <div class="home-word-row">
  {% for w in row %}
  <a href="{{ request.scope.get('study_prefix', '') }}/word/{{ w.id }}" style="text-decoration:none; color:inherit; min-width:0;">
    <div class="card" style="display:flex; align-items:center; gap:16px; margin-bottom:0; padding:14px 18px;"
         onmouseover="this.style.borderColor='var(--blue)'" onmouseout="this.style.borderColor='var(--border)'">
      <div style="font-size:1.8rem;">{{ w.emoji }}</div>
      <div style="flex:1;">
        <div style="font-size:1.05rem; font-weight:700;">{{ w.word }}</div>
      </div>
      <span class="badge badge-blue">学ぶ →</span>
    </div>
  </a>
  {% endfor %}
  </div>
  {% endfor %}
</div>

<style>
.home-word-list { position:relative;display:grid;gap:10px;margin:6px 0 12px; }
.home-word-list::before { content:"";position:absolute;top:-6px;bottom:-6px;left:-6px;width:calc(50% + 1px);border:3px solid var(--blue);border-radius:16px;pointer-events:none;z-index:1; }
.home-word-row { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px; }
@media (max-width:560px) {
  .home-word-row { grid-template-columns:minmax(0,1fr); }
  .home-word-list::before { display:none; }
  .home-word-row > a:first-child { outline:3px solid var(--blue);outline-offset:2px;border-radius:14px; }
}
</style>
