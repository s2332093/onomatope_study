<div class="home-word-list">
  {% for row in word_rows %}
  <div class="home-word-row">
  {% for w in row %}
  <a href="{{ request.scope.get('study_prefix', '') }}/word/{{ w.id }}" style="text-decoration:none; color:inherit; min-width:0;">
    <div class="card home-word-card{% if w.id in completed_words %} is-completed{% endif %}" style="display:flex; align-items:center; gap:16px; margin-bottom:0; padding:14px 18px;">
      <div style="font-size:1.8rem;">{{ w.emoji }}</div>
      <div style="flex:1;">
        <div style="font-size:1.05rem; font-weight:700;">{{ w.word }}</div>
      </div>
      <span class="badge {% if w.id in completed_words %}badge-green{% else %}badge-blue{% endif %}">{% if w.id in completed_words %}✓ 学習済み{% else %}学ぶ →{% endif %}</span>
    </div>
  </a>
  {% endfor %}
  </div>
  {% endfor %}
</div>

<style>
.home-word-list { position:relative;display:grid;gap:10px;margin:6px 0 12px; }
.home-word-card { border:0; }
.home-word-card:hover { background:var(--blue-soft); }
.home-word-card.is-completed { background:#e3f7ec; }
.home-word-row { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px; }
@media (max-width:560px) {
  .home-word-row { grid-template-columns:minmax(0,1fr); }
}
</style>
