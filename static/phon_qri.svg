  <text x="128" y="73" font-size="18" fill="#2f6fed" font-weight="bold" text-anchor="middle">CV</text>
  <!-- 「り」＝残る余韻 -->
  <path d="M158 65 C 172 65, 184 68, 198 68" fill="none" stroke="#e8890c" stroke-width="5" stroke-linecap="round"/>
  <text x="180" y="52" font-size="17" fill="#e8890c" font-weight="bold" text-anchor="middle">り</text>
  <text x="105" y="114" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="middle">「っ」で切れて、「り」で余韻が残る</text>
