<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 120" font-family="sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <line x1="14" y1="96" x2="206" y2="96" stroke="#1f2937" stroke-width="3"/>
