<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 170" font-family="sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- 状況 -->
  <rect x="16" y="58" width="46" height="40" rx="8" fill="none" stroke="#1f2937" stroke-width="4"
        stroke-dasharray="7 5"/>
  <text x="22" y="120" font-size="14" fill="#1f2937" font-weight="bold">状況</text>
  <!-- 状況が動きを引き起こす（意志は関与しない） -->
  <line x1="66" y1="78" x2="112" y2="78" stroke="#f39c12" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="9 6"/>
  <polygon points="128,78 110,68 110,88" fill="#f39c12"/>
  <!-- 動き -->
  <rect x="132" y="58" width="44" height="40" rx="8" fill="none" stroke="#1f2937" stroke-width="4"/>
  <text x="134" y="120" font-size="14" fill="#1f2937" font-weight="bold">動き</text>
  <text x="34" y="36" font-size="15" fill="#f39c12" font-weight="bold">反応して起こる</text>
</svg>
